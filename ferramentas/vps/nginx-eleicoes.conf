# Reserva na VPS: os dois sites com as mesmas regras de cache do Cloudflare (_headers de publicar_cf.py e publicar_mun.py).
# __RAIZ__ é trocado pelo instalar.sh. Porta 80 (Cloudflare com proxy na frente).
gzip_types application/json text/css application/javascript image/svg+xml;

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name eleicoes.inema.club _;
  root __RAIZ__/site;
  index index.html;

  location = /api/acessos { return 404; }   # contador só existe no Worker; a página esconde o número
  location ~ ^/data/(latest|projecao|projecao-historico)\.json$ { add_header Cache-Control "no-cache, max-age=0" always; }
  location ^~ /data/historico/ { add_header Cache-Control "no-cache, max-age=0" always; }
  location ~ ^/data/(br|uf)/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
  location = / { add_header Cache-Control "no-cache" always; try_files /index.html =404; }
  location ~ \.html$ { add_header Cache-Control "no-cache" always; }
  location / { try_files $uri $uri.html $uri/ =404; }
}

server {
  listen 80;
  listen [::]:80;
  server_name municipios.inema.club;
  root __RAIZ__/municipios/site;
  index index.html;

  location = /api/acessos { return 404; }
  location = /data/latest.json { add_header Cache-Control "no-cache, max-age=0" always; }
  location ^~ /data/historico/ { add_header Cache-Control "no-cache, max-age=0" always; }
  location ^~ /data/uf/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
  location ^~ /assets/malha/ { add_header Cache-Control "public, max-age=3600" always; }
  location = / { add_header Cache-Control "no-cache" always; try_files /index.html =404; }
  location ~ \.html$ { add_header Cache-Control "no-cache" always; }
  location / { try_files $uri $uri.html $uri/ =404; }
}
