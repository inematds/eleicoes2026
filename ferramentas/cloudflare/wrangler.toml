# Site estático no Cloudflare (Workers Static Assets, sem script: acessos grátis e sem limite).
# Montado por ferramentas/publicar_cf.py em saida/publicar/ e enviado com `wrangler deploy`.
name = "eleicoes2026"
# script só para /api/acessos (contador); o resto é arquivo estático e nem passa por ele
main = "contador.js"
compatibility_date = "2026-10-01"
# conta: a do login do wrangler (ou CLOUDFLARE_ACCOUNT_ID no ambiente) — não fica no repositório
workers_dev = false
routes = [{ pattern = "eleicoes.inema.club", custom_domain = true }]

[assets]
directory = "../../saida/publicar"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[durable_objects.bindings]]
name = "CONTADOR"
class_name = "Contador"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Contador"]

# chat "Tire suas dúvidas": conversas gravadas + limites de uso (SQLite do Durable Object)
[[durable_objects.bindings]]
name = "CONVERSAS"
class_name = "Conversas"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Conversas"]
